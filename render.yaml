# Paid, single-process hosting for the existing Express + Socket.IO app.
# Expected base cost is $7/month on the 0.5 CPU plan.
services:
  - type: web
    name: alibi
    runtime: node
    region: virginia
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Render sits in front of the app as a reverse proxy. Confirm the hop
      # count from X-Forwarded-For during the first deploy.
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: PUBLIC_ORIGIN
        fromService:
          type: web
          name: alibi
          envVarKey: RENDER_EXTERNAL_URL
