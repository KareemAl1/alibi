# Paid, single-process hosting for the existing Express + Socket.IO app.
# Expected base cost is $7/month on the 0.5 CPU plan.
services:
  - type: web
    name: alibi
    runtime: node
    region: virginia
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Measured on the live service (Oct 27): X-Forwarded-For arrives as
      # [client-supplied..., real client, Cloudflare edge] and the TCP peer is
      # Render's internal proxy, so the real client is 2 hops from the right.
      - key: TRUST_PROXY_HOPS
        value: "2"
      # Render's edge is Cloudflare, which overwrites CF-Connecting-IP with the
      # real client address on every request. Counting X-Forwarded-For hops
      # did not hold up on the custom domain, so the limiter reads this header.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      # PUBLIC_ORIGIN is not set here: the server uses Render's own
      # RENDER_EXTERNAL_URL. Set PUBLIC_ORIGIN only for a custom domain.
